SYMBOLS {
    # Define a default size if none is passed via the command line
    __OBJ_ADDR__: type = weak, value = $0500;
}
MEMORY {
    PROGRAM: start = __OBJ_ADDR__, size = MAIN_SIZE + BF16_CODE_SIZE, file = %O, fill = yes;
}
SEGMENTS {
    MAIN: load = PROGRAM, type = ro, define = yes;
    BF16_CODE: load = PROGRAM, type = ro, define = yes;
}
